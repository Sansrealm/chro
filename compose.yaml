services:
  workforce:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set an unshared APP_PASSWORD of at least 16 characters in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    volumes:
      - workforce_state:/app/.state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  workforce_state:
